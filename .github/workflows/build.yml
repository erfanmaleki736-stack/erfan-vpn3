            Widget _pingBadge(int p) {
              final bad = p < 0;
              final color = bad
                  ? const Color(0xFFEF6F6C)
                  : p < 300
                      ? const Color(0xFF3DBE8B)
                      : const Color(0xFFFFB74D);
              return Container(
