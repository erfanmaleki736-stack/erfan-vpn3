          class ShaderBackground extends StatefulWidget {
            final String asset;
            final bool earth;
            const ShaderBackground({super.key, required this.asset, required this.earth});

            @override
            State<ShaderBackground> createState() => _ShaderBackgroundState();
          }

          class _ShaderBackgroundState extends State<ShaderBackground>
              with SingleTickerProviderStateMixin {
            late final AnimationController _c;
            ui.FragmentShader? _shader;
            bool _failed = false;

            @override
            void initState() {
              super.initState();
              _c = AnimationController(vsync: this, duration: const Duration(hours: 1))
                ..repeat();
              _load();
            }

            Future<void> _load() async {
              try {
                final p = await ui.FragmentProgram.fromAsset(widget.asset);
                if (!mounted) return;
                setState(() => _shader = p.fragmentShader());
              } catch (_) {
                if (mounted) setState(() => _failed = true);
              }
            }

            @override
            void dispose() {
              _c.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (_shader != null) {
                return RepaintBoundary(
                  child: CustomPaint(
                    painter: _ShaderPainter(_shader!, _c),
                    size: Size.infinite,
                  ),
                );
              }
              if (_failed) {
                return CustomPaint(
                  painter: _FallbackPlanet(widget.earth),
                  size: Size.infinite,
                );
              }
              return const ColoredBox(color: Colors.black);
            }
          }

          class _ShaderPainter extends CustomPainter {
            final ui.FragmentShader shader;
            final Animation<double> anim;
            _ShaderPainter(this.shader, this.anim) : super(repaint: anim);

            @override
            void paint(Canvas canvas, Size size) {
              shader.setFloat(0, size.width);
              shader.setFloat(1, size.height);
              shader.setFloat(2, anim.value * 3600.0);
              canvas.drawRect(Offset.zero & size, Paint()..shader = shader);
            }

            @override
            bool shouldRepaint(covariant _ShaderPainter old) => false;
          }

          class _FallbackPlanet extends CustomPainter {
            final bool earth;
            _FallbackPlanet(this.earth);

            @override
            void paint(Canvas canvas, Size s) {
              canvas.drawRect(Offset.zero & s, Paint()..color = Colors.black);
              final c = Offset(s.width / 2, s.height / 2);
              final r = math.min(s.width, s.height) * 0.4;
              final rect = Rect.fromCircle(center: c, radius: r);
              canvas.drawCircle(
                c,
                r,
                Paint()
                  ..shader = RadialGradient(
                    center: const Alignment(-0.4, -0.4),
                    colors: earth
                        ? const [Color(0xFF3A8DDE), Color(0xFF0B2A5B), Color(0xFF020814)]
                        : const [Color(0xFFD8D8D8), Color(0xFF808080), Color(0xFF1A1A1A)],
                  ).createShader(rect),
              );
            }

            @override
            bool shouldRepaint(covariant _FallbackPlanet old) => false;
          }

