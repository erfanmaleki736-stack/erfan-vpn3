            float v = 0.0;
            float a = 0.5;
            for (int i = 0; i < 5; i++) {
              v += a * vnoise(p);
              p = p * 2.03 + vec3(7.1, 3.7, 5.3);
              a *= 0.5;
            }
            return v;
          }

          vec3 starField(vec2 frag, float t) {
            vec2 g = floor(frag / 3.0);
            float h = hash13(vec3(g, 1.7));
            float tw = 0.6 + 0.4 * sin(t * 2.0 + h * 40.0);
            float s = step(0.9965, h) * tw;
            return vec3(s) * vec3(0.9, 0.9, 1.0);
          }

          vec2 craterLayer(vec3 p, float scale) {
            vec3 q = p * scale;
            vec3 ip = floor(q);
            vec3 fp = fract(q);
            float md = 10.0;
            for (int x = -1; x <= 1; x++) {
              for (int y = -1; y <= 1; y++) {
                for (int z = -1; z <= 1; z++) {
                  vec3 g = vec3(float(x), float(y), float(z));
                  float has = step(0.55, hash13(ip + g + vec3(9.0, 9.0, 9.0)));
                  vec3 o = vec3(
                    hash13(ip + g),
                    hash13(ip + g + vec3(17.1, 3.3, 5.7)),
                    hash13(ip + g + vec3(2.2, 19.1, 4.4)));
                  float dd = length(g + o - fp);
                  float dv = mix(10.0, dd, has);
                  md = min(md, dv);
                }
              }
            }
            float floorv = 1.0 - smoothstep(0.12, 0.30, md);
            float rim = smoothstep(0.26, 0.33, md) * (1.0 - smoothstep(0.33, 0.42, md));
            return vec2(floorv, rim);
          }

          void main() {
            vec2 frag = FlutterFragCoord().xy;
            float m = min(uSize.x, uSize.y);
            vec2 uv = (frag - 0.5 * uSize) / m;
            uv.y = -uv.y;

            float R = 0.40;
            float d = length(uv);
            vec3 col = vec3(0.0, 0.0, 0.01) + starField(frag, uTime);

            vec3 L = normalize(vec3(-0.75 + 0.1 * sin(uTime * 0.05), 0.25, 0.60));

            if (d < R) {
              float zz = sqrt(max(1.0 - (d / R) * (d / R), 0.0));
              vec3 n = vec3(uv / R, zz);

              float a = uTime * 0.03;
              float ca = cos(a);
              float sa = sin(a);
              vec3 p = vec3(ca * n.x + sa * n.z, n.y, -sa * n.x + ca * n.z);

              vec3 base = vec3(0.62, 0.60, 0.57);
              float mar = smoothstep(0.48, 0.62, fbm(p * 1.4));
              base = mix(base, vec3(0.27, 0.27, 0.30), mar * 0.8);

              vec2 c1 = craterLayer(p, 4.0);
              vec2 c2 = craterLayer(p, 9.0);
              base = base * (1.0 - 0.35 * c1.x - 0.22 * c2.x);
              base = base + vec3(c1.y * 0.12 + c2.y * 0.08);

              base = base * (0.82 + 0.36 * fbm(p * 14.0));

              float ndl = dot(n, L);
              float lightAmt = smoothstep(-0.04, 0.30, ndl);
              vec3 lit = base * (0.03 + 1.10 * lightAmt);
              lit += vec3(0.02, 0.03, 0.05) * (1.0 - lightAmt);

              float rimGlow = pow(1.0 - n.z, 4.0);
              lit += vec3(0.5, 0.55, 0.7) * rimGlow * 0.12 * lightAmt;

              col = lit;
            } else {
              float g = 1.0 - smoothstep(R, R * 1.25, d);
              float side = 0.3 + 0.7 * smoothstep(-0.6, 0.6, dot(normalize(uv), normalize(L.xy)));
              col += vec3(0.55, 0.62, 0.85) * pow(g, 3.0) * 0.45 * side;
            }

            col = pow(col, vec3(0.92, 0.92, 0.92));
            fragColor = vec4(col, 1.0);
          }
          MOON_EOF

      - name: Patch Android settings
        working-directory: app/android
        run: |
          M=app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="ERFAN VPN"/' $M
          sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>/' $M
          for G in app/build.gradle.kts app/build.gradle; do
            if [ -f "$G" ]; then
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$G"
              if [ "$G" = "app/build.gradle.kts" ]; then
                sed -i '0,/^android {/s//android {\n    packaging { jniLibs { useLegacyPackaging = true } }/' "$G"
              else
                sed -i '0,/^android {/s//android {\n    packagingOptions { jniLibs { useLegacyPackaging = true } }/' "$G"
              fi
            fi
          done
          cat $M

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: ERFAN-apk
          path: app/build/app/outputs/flutter-apk/*.apk
