          class _SlideGradient extends GradientTransform {
            final double p;
            const _SlideGradient(this.p);

            @override
            Matrix4? transform(Rect bounds, {TextDirection? textDirection}) =>
                Matrix4.translationValues(bounds.width * p, 0.0, 0.0);
          }

          class ErfanBackground extends StatefulWidget {
            const ErfanBackground({super.key});

            @override
            State<ErfanBackground> createState() => _ErfanBackgroundState();
          }

          class _ErfanBackgroundState extends State<ErfanBackground>
              with SingleTickerProviderStateMixin {
            late final AnimationController _c;

            @override
            void initState() {
              super.initState();
              _c = AnimationController(vsync: this, duration: const Duration(seconds: 60))
                ..repeat();
            }

            @override
            void dispose() {
              _c.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return RepaintBoundary(
                child: AnimatedBuilder(
                  animation: _c,
                  builder: (context, _) {
                    final t = _c.value;
                    final a = t * 2 * math.pi;
                    return Container(
                      color: Colors.black,
                      child: Align(
                        alignment:
                            Alignment(0.62 * math.sin(a * 3), 0.7 * math.cos(a * 2)),
                        child: ShaderMask(
                          blendMode: BlendMode.srcIn,
                          shaderCallback: (rect) => LinearGradient(
                            colors: const [
                              Color(0xFFFF3B6B),
                              Color(0xFFFFB02E),
                              Color(0xFFFFF04D),
                              Color(0xFF4DFF88),
                              Color(0xFF2EE6FF),
                              Color(0xFF6B7BFF),
                              Color(0xFFC04DFF),
                              Color(0xFFFF3B6B),
                            ],
                            tileMode: TileMode.repeated,
                            transform: _SlideGradient((t * 12) % 1.0),
                          ).createShader(rect),
                          child: const Text(
                            'ERFAN',
                            style: TextStyle(
                              color: Colors.white,
                              fontSize: 22,
                              fontWeight: FontWeight.w800,
                              letterSpacing: 8,
                            ),
                          ),
                        ),
                      ),
                    );
                  },
                ),
              );
            }
          }

          // ============================================================
          //  پس‌زمینه ۲: حالت هکری
          // ============================================================

          const _hackChars = [
            '0', '1', 'ア', 'カ', 'サ', 'タ', 'ナ', 'ハ', 'マ', 'ヤ',
            'ラ', 'ワ', '7', '3', '9', 'Z', 'X', '#', '>', '\$',
          ];

          class HackerBackground extends StatefulWidget {
            const HackerBackground({super.key});

            @override
            State<HackerBackground> createState() => _HackerBackgroundState();
          }

          class _HackerBackgroundState extends State<HackerBackground>
              with SingleTickerProviderStateMixin {
            late final AnimationController _c;
            final List<List<TextPainter>> _glyphs = [];

            @override
            void initState() {
              super.initState();
              const colors = [
                Color(0xFFD8FFE9),
                Color(0xFF00FF9C),
                Color(0xFF00B36B),
                Color(0xFF006B40),
              ];
              for (final col in colors) {
                final row = <TextPainter>[];
                for (final ch in _hackChars) {
                  final tp = TextPainter(
                    text: TextSpan(
                        text: ch,
                        style: TextStyle(
                            fontSize: 15, color: col, fontFamily: 'monospace')),
                    textDirection: TextDirection.ltr,
                  )..layout();
                  row.add(tp);
                }
                _glyphs.add(row);
              }
              _c = AnimationController(vsync: this, duration: const Duration(seconds: 60))
                ..repeat();
            }

            @override
            void dispose() {
              _c.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return RepaintBoundary(
                child: CustomPaint(
                  painter: _HackerPainter(_c, _glyphs),
                  size: Size.infinite,
                ),
              );
            }
          }

          class _HackerPainter extends CustomPainter {
            final Animation<double> anim;
            final List<List<TextPainter>> glyphs;
            _HackerPainter(this.anim, this.glyphs) : super(repaint: anim);

            @override
            void paint(Canvas canvas, Size s) {
              canvas.drawRect(Offset.zero & s, Paint()..color = const Color(0xFF000503));
              final t = anim.value;
              const cell = 18.0;
              final cols = (s.width / cell).floor();
              final rows = (s.height / cell).ceil() + 1;
              final n = _hackChars.length;
              final flick = (t * 300).floor();
              for (int i = 0; i < cols; i++) {
                final seed = ((i * 7919) % 100) / 100.0;
                final k = 6 + (i * 13) % 7;
                final head = ((seed + t * k) % 1.0) * (rows + 18);
                for (int j = 0; j < 16; j++) {
                  final row = head.floor() - j;
                  if (row < 0 || row >= rows) continue;
                  final level = j == 0 ? 0 : (j < 4 ? 1 : (j < 9 ? 2 : 3));
                  final gi = (i * 7 + row * 3 + flick) % n;
                  glyphs[level][gi].paint(canvas, Offset(i * cell + 2, row * cell));
                }
              }
            }

            @override
            bool shouldRepaint(covariant _HackerPainter old) => false;
          }

