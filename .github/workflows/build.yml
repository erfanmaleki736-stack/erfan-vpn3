            String _fmt(int b) {
              if (b < 1024) return '$b B';
              if (b < 1024 * 1024) return '${(b / 1024).toStringAsFixed(1)} KB';
              return '${(b / 1024 / 1024).toStringAsFixed(1)} MB';
            }

            Widget _background() {
              switch (S.bg) {
                case 1:
                  return const HackerBackground();
                case 2:
                  return const ShaderBackground(asset: 'shaders/earth.frag', earth: true);
                case 3:
                  return const ShaderBackground(asset: 'shaders/moon.frag', earth: false);
                default:
                  return const ErfanBackground();
              }
            }

