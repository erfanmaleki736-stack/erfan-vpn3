          cat > app/shaders/earth.frag <<'EARTH_EOF'
          #version 460 core
          #include <flutter/runtime_effect.glsl>

          uniform vec2 uSize;
          uniform float uTime;

          out vec4 fragColor;

          float hash13(vec3 p3) {
            p3 = fract(p3 * 0.1031);
            p3 += dot(p3, p3.zyx + 31.32);
            return fract((p3.x + p3.y) * p3.z);
          }

          float vnoise(vec3 x) {
            vec3 i = floor(x);
            vec3 f = fract(x);
            f = f * f * (3.0 - 2.0 * f);
            float n000 = hash13(i);
            float n100 = hash13(i + vec3(1.0, 0.0, 0.0));
            float n010 = hash13(i + vec3(0.0, 1.0, 0.0));
            float n110 = hash13(i + vec3(1.0, 1.0, 0.0));
            float n001 = hash13(i + vec3(0.0, 0.0, 1.0));
            float n101 = hash13(i + vec3(1.0, 0.0, 1.0));
            float n011 = hash13(i + vec3(0.0, 1.0, 1.0));
            float n111 = hash13(i + vec3(1.0, 1.0, 1.0));
            return mix(mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),
                       mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y), f.z);
          }

          float fbm(vec3 p) {
            float v = 0.0;
            float a = 0.5;
            for (int i = 0; i < 5; i++) {
              v += a * vnoise(p);
              p = p * 2.03 + vec3(7.1, 3.7, 5.3);
              a *= 0.5;
            }
            return v;
          }

          vec3 starField(vec2 frag, float t) {
            vec2 g = floor(frag / 3.0);
            float h = hash13(vec3(g, 1.7));
            float tw = 0.6 + 0.4 * sin(t * 2.0 + h * 40.0);
            float s = step(0.9965, h) * tw;
            return vec3(s) * vec3(0.8 + 0.2 * h, 0.85, 1.0);
          }

          void main() {
            vec2 frag = FlutterFragCoord().xy;
            float m = min(uSize.x, uSize.y);
            vec2 uv = (frag - 0.5 * uSize) / m;
            uv.y = -uv.y;

            float R = 0.42;
            float d = length(uv);
            vec3 col = vec3(0.0, 0.0, 0.012) + starField(frag, uTime);

            vec3 L = normalize(vec3(-0.65, 0.30, 0.70));

            if (d < R) {
              float zz = sqrt(max(1.0 - (d / R) * (d / R), 0.0));
              vec3 n = vec3(uv / R, zz);

              float tilt = 0.41;
              float ct = cos(tilt);
              float st = sin(tilt);
              vec3 q = vec3(n.x, ct * n.y - st * n.z, st * n.y + ct * n.z);

              float a = uTime * 0.12;
              float ca = cos(a);
              float sa = sin(a);
              vec3 p = vec3(ca * q.x + sa * q.z, q.y, -sa * q.x + ca * q.z);

              float h = fbm(p * 2.4);
              float land = smoothstep(0.52, 0.56, h);
              float elev = clamp((h - 0.52) * 4.0, 0.0, 1.0);

              float depth = clamp((0.52 - h) * 3.0, 0.0, 1.0);
              vec3 ocean = mix(vec3(0.02, 0.28, 0.52), vec3(0.0, 0.05, 0.22), depth);

              float dry = fbm(p * 1.3 + vec3(3.0, 3.0, 3.0));
              vec3 green = vec3(0.12, 0.38, 0.14);
              vec3 sand = vec3(0.62, 0.52, 0.30);
              vec3 rock = vec3(0.42, 0.36, 0.30);
              vec3 landCol = mix(green, sand, smoothstep(0.45, 0.65, dry));
              landCol = mix(landCol, rock, smoothstep(0.25, 0.8, elev));

              float lat = abs(p.y);
              float ice = smoothstep(0.78, 0.88, lat + (h - 0.5) * 0.25);
              landCol = mix(landCol, vec3(0.93, 0.96, 1.0), ice);
              ocean = mix(ocean, vec3(0.85, 0.92, 0.98), smoothstep(0.86, 0.94, lat));

              vec3 base = mix(ocean, landCol, land);

              float a2 = uTime * 0.15;
              vec3 pc = vec3(cos(a2) * q.x + sin(a2) * q.z, q.y, -sin(a2) * q.x + cos(a2) * q.z);
              float cl = fbm(pc * 3.2 + vec3(5.0, 1.0, 2.0));
              float clouds = smoothstep(0.52, 0.78, cl);

              float ndl = dot(n, L);
              float lightAmt = smoothstep(-0.05, 0.35, ndl);
              vec3 lit = base * (0.04 + 1.05 * lightAmt);

              lit = mix(lit, vec3(1.0, 1.0, 1.0) * (0.08 + 0.95 * lightAmt), clouds * 0.85);

              vec3 V = vec3(0.0, 0.0, 1.0);
              vec3 Hh = normalize(L + V);
              float spec = pow(max(dot(n, Hh), 0.0), 70.0) * (1.0 - land) * (1.0 - clouds);
              lit += vec3(0.9, 0.95, 1.0) * spec * 0.6;

              float night = 1.0 - smoothstep(-0.1, 0.12, ndl);
              float cities = pow(vnoise(p * 38.0), 7.0) * 14.0 * land * (1.0 - ice) * (1.0 - clouds);
              lit += vec3(1.0, 0.75, 0.35) * cities * night * 0.9;

              float fres = pow(1.0 - n.z, 3.0);
              vec3 atm = vec3(0.25, 0.55, 1.0);
              lit += atm * fres * (0.25 + 0.9 * lightAmt);

              col = lit;
            } else {
              float g = 1.0 - smoothstep(R, R * 1.22, d);
              float side = 0.35 + 0.65 * smoothstep(-0.6, 0.6, dot(normalize(uv), normalize(L.xy)));
              col += vec3(0.15, 0.4, 1.0) * pow(g, 3.0) * 0.85 * side;
            }

            col = pow(col, vec3(0.92, 0.92, 0.92));
            fragColor = vec4(col, 1.0);
          }
